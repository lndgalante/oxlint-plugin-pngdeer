name: Bug report
description: The rule or the command did something wrong. No warnings at all? Go through the checklist at https://github.com/lndgalante/oxlint-plugin-slimdeer/blob/main/docs/rules/compressible-image.md#no-warnings first.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the warning or the stderr line (the rule and the command print their notes on stderr).
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The output of these commands, and your OS.
      value: |
        npx oxlint --version (or npx eslint --version):
        npx oxlint-plugin-slimdeer --version:
        node --version:
        OS:
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: The image
      description: If you can share it, attach the image involved. If the engine itself fails on it ("a bug in HeyDeer's slimdeer engine"), report it at https://github.com/heydeer/slimdeer/issues as well.
