name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly against the newest oxlint too: its JS plugin API is alpha and not covered by semver.
  # GitHub pauses scheduled runs after 60 days without activity in the repository; turn it back on
  # under Actions > CI.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
        include:
          # the oldest Node package.json allows
          - os: ubuntu-latest
            node: 20.19.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run lint
      - run: node scripts/check-engine.js
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/test-reporter.mjs --test-reporter-destination=stdout
      - run: npm run check:package

  # The oldest ESLint the rule supports, which ignores meta.defaultOptions (the main jobs run ESLint 10).
  eslint-9-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@9.0.0
      - run: npx eslint --version
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/test-reporter.mjs --test-reporter-destination=stdout test/eslint.test.js
      - run: npm run check:package

  # The oldest oxlint the peer range allows, and 1.89, which Vite+ 1.4 bundles (the main jobs run 1.90).
  older-oxlint:
    strategy:
      fail-fast: false
      matrix:
        oxlint: ["1.60.0", "1.89.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save oxlint@${{ matrix.oxlint }}
      - run: npx oxlint --version
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/test-reporter.mjs --test-reporter-destination=stdout
      - run: npm run check:package

  latest-oxlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save oxlint@latest
      - run: npx oxlint --version
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/test-reporter.mjs --test-reporter-destination=stdout
      - run: npm run check:package
