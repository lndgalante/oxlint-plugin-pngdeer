name: Release

# Publishes to npm when a v* tag is pushed, with provenance, through npm's trusted publishing (no
# token). npm can only trust a workflow for a package that exists, so the first version is published
# by hand; pushing its tag afterwards is a no-op here. Add this repository and workflow as the
# trusted publisher on npmjs.com just before pushing the next tag: a new trusted publisher that
# hasn't published within 2 days expires, and has to be deleted and added again.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub Release
  id-token: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$passed" -gt 0 || { echo "CI must pass for this commit before publishing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip versions already on npm
        id: published
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version >/dev/null 2>&1; then
            echo "already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # A prerelease (v1.2.3-rc.1) goes out as "next", so it isn't what `npm install` picks.
      - if: steps.published.outputs.skip != 'true'
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
      - name: Verify the published package
        run: npm run check:published
      # A GitHub Release with the commits since the last tag. Say in its notes whether the engine
      # changed: a new engine measures every image again.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if test -f "$notes"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$notes" $pre
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $pre
          fi
