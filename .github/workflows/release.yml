name: Release

# Publishes to npm when a v* tag is pushed, with provenance, through npm's trusted publishing (no
# token). Each job gets only what it needs: the tests run without publish rights, and the publish
# job, in the `npm` environment, runs no dependency code. The trusted publisher on npmjs.com names
# this workflow and the `npm` environment. A new trusted publisher that hasn't published within 2
# days expires, and has to be deleted and added again, so add it just before pushing a tag. A manual
# run finishes an already published tag (the checks and the GitHub Release) without publishing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published v* tag to verify and finish (no publish)
        required: true

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      # The later jobs check out this commit, so a tag moved meanwhile can't change what is published.
      - name: Require successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$passed" -gt 0 || { echo "CI must pass for this commit before publishing"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - name: Release notes exist, and CHANGELOG.md dates the version
        run: |
          version="${RELEASE_TAG#v}"
          test -f "docs/releases/$version.md" || { echo "Write docs/releases/$version.md first"; exit 1; }
          case "$version" in
            *-*) ;;
            *) grep -qF "## $version (2" CHANGELOG.md || { echo "Date $version in CHANGELOG.md, like: ## $version ($(date -u +%F))"; exit 1; } ;;
          esac
      - run: npm ci
      - run: npm test
      - run: npm run check:package

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Skip versions already on npm
        id: published
        run: |
          if npm view "$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')" version >/dev/null 2>&1; then
            echo "already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # A prerelease (v1.2.3-rc.1) goes out as "next", so it isn't what `npm install` picks.
      - if: ${{ steps.published.outputs.skip != 'true' }}
        run: |
          tag=latest
          case "$RELEASE_TAG" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

  # Checks the package npm serves with the repo's oxlint and ESLint, after publish, or without it in a
  # manual run.
  check-published:
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Verify the published package
        run: |
          log="$RUNNER_TEMP/slimdeer-published-check.log"
          for attempt in {1..12}; do
            if npm run check:published >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            cat "$log"
            # Metadata and tarballs can become available at different times after publishing.
            grep -Eq 'npm error code (E404|ETARGET)' "$log" || exit 1
            sleep 10
          done
          echo "npm has not made the published package available yet" >&2
          exit 1

  # A GitHub Release with the notes in docs/releases/<version>.md. Say in them whether the engine
  # changed: a new engine measures every image again.
  release:
    needs: [verify, check-published]
    if: ${{ !cancelled() && needs.check-published.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          case "$RELEASE_TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$RELEASE_TAG" --verify-tag --notes-file "docs/releases/${RELEASE_TAG#v}.md" $pre
