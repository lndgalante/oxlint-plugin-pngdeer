name: Engine build

on:
  push:
    branches: [main]
    paths: ["engine/**", "scripts/engine/**", "scripts/build-engine.js", "scripts/check-engine.js", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "scripts/engine/**", "scripts/build-engine.js", "scripts/check-engine.js", ".github/workflows/engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-engine.js
      - run: node scripts/build-engine.js --output "${{ runner.temp }}/engine-build"
      - name: Build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-build
          path: ${{ runner.temp }}/engine-build
          if-no-files-found: ignore
