name: Engine build

on:
  push:
    branches: [main]
    paths: ["engine/**", "scripts/engine/**", "scripts/build-engine.js", "scripts/check-engine.js", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "scripts/engine/**", "scripts/build-engine.js", "scripts/check-engine.js", ".github/workflows/engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-engine.js
      - run: node scripts/build-engine.js --output "${{ runner.temp }}/engine-build"
      - name: Build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-build
          path: ${{ runner.temp }}/engine-build
          if-no-files-found: ignore
